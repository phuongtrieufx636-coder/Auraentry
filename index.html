<style>

    * {

    .main-layout {

        background: var(--bg-secondary);

<script>
    let currentSymbol = 'XAUUSD';

    let lastSignal = null;
    
    // Initialize TradingView
    function initTradingView() {
        if (typeof TradingView !== 'undefined') {
            try {
                tvWidget = new TradingView.widget({
                    "autosize": true,
                    "symbol": "OANDA:XAUUSD",

                    "style": "1",
                    "locale": "en",
                    "toolbar_bg": "#131829",

                    "hide_side_toolbar": false,
                    "allow_symbol_change": true,
                    "studies": [
                        "RSI@tv-basicstudies",
                        "MASimple@tv-basicstudies"
                    ],
                    "container_id": "tradingview_chart",
                    "backgroundColor": "#1a1f3a",
                    "gridColor": "#2d3748"

                console.error('TradingView error:', error);

    function changeSymbol(symbol, btn) {
        currentSymbol = symbol;
        
        document.querySelectorAll('.symbol-btn').forEach(b => {
            b.classList.remove('active');
        });
        btn.classList.add('active');
        
        const symbolMap = {
            'XAUUSD': 'OANDA:XAUUSD',
            'BTCUSD': 'BITSTAMP:BTCUSD',
            'EURUSD': 'FX:EURUSD',
            'USDJPY': 'FX:USDJPY'
        };
        
        if (tvWidget && tvWidget.setSymbol) {
            tvWidget.setSymbol(symbolMap[symbol], '15');
        }
    }
    
    async function analyzeMarket() {
        const apiKey = document.getElementById('apiKey').value;
        
        if (!apiKey) {
            showMessage('analysisContent', 'error', '❌ Vui lòng nhập Groq API Key trong Settings');
            return;
        }
        
        if (!apiKey.startsWith('gsk_')) {
            showMessage('analysisContent', 'error', '❌ API Key không hợp lệ (phải bắt đầu bằng gsk_)');
            return;
        }
        
        document.getElementById('analysisContent').innerHTML = `
            <div class="analysis-loading">
                <div class="spinner"></div>
                <div style="color: var(--text-secondary); font-size: 13px;">
                    Đang phân tích với AI...
                </div>
            </div>
        `;
        
        try {
            const strategy = document.getElementById('strategy').value;
            const prompt = buildPrompt(strategy);
            
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [
                        {
                            role: 'system',
                            content: 'You are a professional forex trading analyst specializing in ICT, SMC, and price action.'
                        },
                        {
                            role: 'user',
                            content: prompt
                        }
                    ],
                    temperature: 0.7,
                    max_tokens: 500
                })
            });
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API Error ${response.status}: ${errorText}`);
            }
            
            const data = await response.json();
            
            if (data.choices && data.choices[0]) {
                const aiResponse = data.choices[0].message.content;
                console.log('AI Response:', aiResponse);
                parseAndDisplaySignal(aiResponse);
            } else {
                throw new Error('Invalid API response format');
            }
            
        } catch (error) {
            console.error('Analysis error:', error);
            showMessage('analysisContent', 'error', `❌ ${error.message}`);
        }
    }

            'AI_HYBRID': 'Kết hợp ICT, SMC và Price Action'
        };
        
        return `Phân tích thị trường ${currentSymbol} sử dụng ${strategyText[strategy]}.

    function parseAndDisplaySignal(aiResponse) {
        try {
            console.log('Parsing:', aiResponse);
            
            const parts = aiResponse.split('|').map(p => p.trim());
            
            if (parts.length < 6) {
                throw new Error('Invalid response format');
            }
            
            const signal = {
                type: parts[0].split(':')[1].trim().toUpperCase(),
                entry: parts[1].split(':')[1].trim(),
                sl: parts[2].split(':')[1].trim(),
                tp: parts[3].split(':')[1].trim(),
                confidence: parts[4].split(':')[1].trim(),
                reason: parts[5].split(':')[1].trim()
            };
            
            lastSignal = signal;
            
            const signalClass = signal.type.toLowerCase();
            const rr = calculateRR(signal);
            
            document.getElementById('analysisContent').innerHTML = `
                <div class="signal-card">
                    <div class="signal-header">
                        <div class="signal-type ${signalClass}">${signal.type}</div>
                        <div class="confidence">⭐ ${signal.confidence}</div>
                    </div>
                    <div class="signal-details">
                        <div class="detail-item">
                            <div class="detail-label">Entry</div>
                            <div class="detail-value">${signal.entry}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Stop Loss</div>
                            <div class="detail-value">${signal.sl}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Take Profit</div>
                            <div class="detail-value">${signal.tp}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Risk/Reward</div>
                            <div class="detail-value">${rr}</div>
                        </div>
                    </div>
                    <div class="signal-reason">
                        💡 ${signal.reason}
                    </div>
                </div>
            `;
            
        } catch (error) {
            console.error('Parse error:', error);
            showMessage('analysisContent', 'error', `❌ Không thể phân tích phản hồi: ${error.message}`);
        }
    }
    
    function calculateRR(signal) {
        try {
            const entry = parseFloat(signal.entry.replace(/[^0-9.]/g, ''));
            const sl = parseFloat(signal.sl.replace(/[^0-9.]/g, ''));
            const tp = parseFloat(signal.tp.replace(/[^0-9.]/g, ''));
            
            const risk = Math.abs(entry - sl);
            const reward = Math.abs(tp - entry);
            
            if (risk > 0) {
                const rr = reward / risk;
                return `1:${rr.toFixed(2)}`;
            }
        } catch (e) {
            console.error('R:R calculation error:', e);
        }
        return 'N/A';
    }

            return;
        }
        
        const message = `
