            // Call Groq API

            renderAIResult(result);

        } catch (error) {
            console.error('Analysis error:', error);

            btn.disabled = false;

    function parseAIResponse(text) {
        const parts = text.split('|');
        const result = {
            signal: 'NEUTRAL',
            entry: 0,
            sl: 0,
            tp: 0,
            confidence: 0,
            reason: ''
        };
        
        parts.forEach(part => {
            const [key, value] = part.split(':').map(s => s.trim());
            
            if (key === 'SIGNAL') result.signal = value;
            else if (key === 'ENTRY') result.entry = parseFloat(value);
            else if (key === 'SL') result.sl = parseFloat(value);
            else if (key === 'TP') result.tp = parseFloat(value);
            else if (key === 'CONFIDENCE') result.confidence = parseInt(value);
            else if (key === 'REASON') result.reason = value;
        });
        
        return result;
    }
    
    function renderAIResult(result) {
        const container = document.getElementById('aiResultContainer');
        const signalClass = result.signal.toLowerCase();
        
        container.innerHTML = `
            <div class="ai-result">
                <div class="ai-signal ${signalClass}">
                    ${result.signal === 'BUY' ? '📈' : result.signal === 'SELL' ? '📉' : '⏸️'} 
                    ${result.signal}
                </div>
                
                <div class="ai-details">
                    <div class="ai-detail-item">
                        <div class="ai-detail-label">Entry Price</div>
                        <div class="ai-detail-value" style="color: var(--accent-blue);">
                            ${result.entry.toFixed(2)}
                        </div>
                    </div>
                    <div class="ai-detail-item">
                        <div class="ai-detail-label">Stop Loss</div>
                        <div class="ai-detail-value" style="color: var(--accent-red);">
                            ${result.sl.toFixed(2)}
                        </div>
                    </div>
                    <div class="ai-detail-item">
                        <div class="ai-detail-label">Take Profit</div>
                        <div class="ai-detail-value" style="color: var(--accent-green);">
                            ${result.tp.toFixed(2)}
                        </div>
                    </div>
                    <div class="ai-detail-item">
                        <div class="ai-detail-label">Confidence</div>
                        <div class="ai-detail-value" style="color: var(--accent-yellow);">
                            ${result.confidence}%
                        </div>
                    </div>
                </div>
                
                <div class="ai-reason">
                    <strong>Lý do:</strong> ${result.reason}
                </div>
            </div>
        `;
    }
    
    // Toast Notifications
    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        
        document.body.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 100);
        
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    document.getElementById('settingsBtn').addEventListener('click', () => {
        document.getElementById('settingsModal').classList.add('active');

        document.getElementById('apiKeyInput').value = config.apiKey;
        document.getElementById('symbolInput').value = config.symbol;

        document.getElementById('strategyInput').value = config.strategy;

    document.getElementById('closeModal').addEventListener('click', () => {

    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
        config.apiKey = document.getElementById('apiKeyInput').value;
