<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap');
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    :root {
        --bg-primary: #0a0e27;
        --bg-secondary: #131829;
        --bg-tertiary: #1a1f3a;
        --accent-cyan: #00d9ff;
        --accent-purple: #a855f7;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --accent-yellow: #fbbf24;
        --text-primary: #e5e7eb;
        --text-secondary: #9ca3af;
        --border-color: #2d3748;
        
        --shadow-glow: 0 0 20px rgba(0, 217, 255, 0.3);
        --shadow-card: 0 4px 6px rgba(0, 0, 0, 0.3);

    body {
        font-family: 'JetBrains Mono', monospace;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
    }
    
    /* Animated gradient background */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.1) 0%, transparent 50%);
        animation: pulse 15s ease-in-out infinite;
        z-index: -1;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
    }
    
    .container {
        max-width: 1920px;
        margin: 0 auto;
        padding: 20px;
    }
    
    /* Header */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 30px;
        background: var(--bg-secondary);
        border-radius: 16px;
        margin-bottom: 20px;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--border-color);
    }
    
    .logo {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -1px;
    }
    
    .account-info {
        display: flex;
        gap: 30px;
        align-items: center;
    }
    
    .stat {
        text-align: right;
    }
    
    .stat-label {
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .stat-value {
        font-size: 20px;
        font-weight: 700;
        margin-top: 4px;
    }
    
    .stat-value.positive { color: var(--accent-green); }
    .stat-value.negative { color: var(--accent-red); }
    
    /* Main Layout */
    .main-layout {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 20px;
        height: calc(100vh - 180px);
    }
    
    /* Chart Container */
    .chart-section {
        background: var(--bg-secondary);
        border-radius: 16px;
        padding: 20px;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
    }
    
    .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    
    .symbol-selector {
        display: flex;
        gap: 10px;
    }
    
    .symbol-btn {
        padding: 8px 16px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-primary);
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.3s;
    }
    
    .symbol-btn:hover {
        border-color: var(--accent-cyan);
        box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
    }
    
    .symbol-btn.active {
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));

    }
    
    #tradingview_chart {
        flex: 1;
        border-radius: 12px;

    /* Control Panel */

        background: var(--bg-secondary);

        box-shadow: var(--shadow-card);

    .spinner {

    @keyframes spin {

    /* MTF Analysis */

        border-left: 3px solid var(--border-color);

    .mtf-indicators {

        letter-spacing: 0.5px;
    }
    
    .setting-input {
        padding: 10px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 13px;
    }
    
    .setting-input:focus {
        outline: none;
        border-color: var(--accent-cyan);
        box-shadow: 0 0 10px rgba(0, 217, 255, 0.2);
    }
    
    /* Buttons */
    .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;

    .btn {
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-family: 'Space Grotesk', sans-serif;

    /* Scrollbar */

    /* Responsive */

        .main-layout {

<script>
    // Global state
    let currentSymbol = 'OANDA:XAUUSD';
    let tvWidget = null;
    let lastSignal = null;
    let analysisTimer = null;
    
    // Initialize TradingView Widget
    function initTradingView() {
        tvWidget = new TradingView.widget({
            "width": "100%",
            "height": "100%",
            "symbol": currentSymbol,
            "interval": "15",
            "timezone": "Asia/Ho_Chi_Minh",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#131829",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "studies": [
                "RSI@tv-basicstudies",
                "MACD@tv-basicstudies"
            ],
            "container_id": "tradingview_chart",
            "backgroundColor": "#1a1f3a",
            "gridColor": "#2d3748"
        });
    }
    
    // Change symbol
    function changeSymbol(symbol) {
        const symbolMap = {
            'XAUUSD': 'OANDA:XAUUSD',
            'BTCUSD': 'BITSTAMP:BTCUSD',
            'EURUSD': 'FX:EURUSD',
            'USDJPY': 'FX:USDJPY'
        };
        
        currentSymbol = symbolMap[symbol];
        
        // Update active button
        document.querySelectorAll('.symbol-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');
        
        // Reload chart
        if (tvWidget) {
            tvWidget.setSymbol(currentSymbol, '15', () => {
                console.log('Symbol changed to:', currentSymbol);
            });
        }
    }
    
    // Analyze market with AI
    async function analyzeMarket() {
        const apiKey = document.getElementById('apiKey').value;
        if (!apiKey) {
            alert('Please enter your Groq API key in settings');
            return;
        }
        
        // Show loading
        document.getElementById('analysisContent').innerHTML = `
            <div class="analysis-loading">
                <div class="spinner"></div>
                <div style="color: var(--text-secondary); font-size: 13px;">
                    Analyzing market with AI...
                </div>
            </div>
        `;
        
        try {
            // Call Groq API
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [
                        {
                            role: 'system',
                            content: 'You are a professional forex trading analyst.'
                        },
                        {
                            role: 'user',
                            content: buildAnalysisPrompt()
                        }
                    ],
                    temperature: 0.7,
                    max_tokens: 500
                })
            });
            
            const data = await response.json();
            
            if (data.choices && data.choices[0]) {
                const aiResponse = data.choices[0].message.content;
                parseAndDisplaySignal(aiResponse);
            } else {
                throw new Error('Invalid API response');
            }
            
        } catch (error) {
            console.error('Analysis error:', error);
            document.getElementById('analysisContent').innerHTML = `
                <div style="color: var(--accent-red); text-align: center; padding: 20px;">
                    ❌ Analysis failed: ${error.message}
                </div>
            `;
        }
    }
    
    // Build analysis prompt
    function buildAnalysisPrompt() {
        const symbol = currentSymbol.split(':')[1] || 'XAUUSD';
        
        let prompt = `Phân tích thị trường ${symbol} và đưa ra quyết định giao dịch cụ thể. `;
        prompt += `Sử dụng kết hợp ICT, SMC và price action để phân tích toàn diện. `;
        prompt += `Tìm confluence của các tín hiệu để xác định entry, SL và TP tốt nhất. `;
        
        // Add MTF if enabled
        const enableMTF = document.getElementById('enableMTF').value === 'true';
        if (enableMTF) {
            prompt += `\n\nQUAN TRỌNG - Phân tích đa khung thời gian:\n`;
            prompt += `Xem xét M15, H1, và H4 để xác nhận xu hướng.\n`;
            prompt += `Chỉ vào lệnh khi cả 3 khung đồng thuận!\n\n`;
        }
        
        prompt += `Hãy phân tích và trả lời CHÍNH XÁC theo format sau:\n`;
        prompt += `SIGNAL: BUY hoặc SELL hoặc NEUTRAL|\n`;
        prompt += `ENTRY: [giá vào lệnh cụ thể]|\n`;
        prompt += `SL: [giá stop loss cụ thể]|\n`;
        prompt += `TP: [giá take profit cụ thể]|\n`;
        prompt += `CONFIDENCE: [0-100]%|\n`;
        prompt += `REASON: [lý do ngắn gọn]`;
        
        return prompt;
    }
    
    // Parse and display AI signal
    function parseAndDisplaySignal(aiResponse) {
        try {
            // Parse response
            const parts = aiResponse.split('|');
            const signal = {
                type: parts[0].split(':')[1].trim(),
                entry: parts[1].split(':')[1].trim(),
                sl: parts[2].split(':')[1].trim(),
                tp: parts[3].split(':')[1].trim(),
                confidence: parts[4].split(':')[1].trim(),
                reason: parts[5].split(':')[1].trim()
            };
            
            lastSignal = signal;
            
            // Display signal
            const signalClass = signal.type.toLowerCase();
            document.getElementById('analysisContent').innerHTML = `
                <div class="signal-card">
                    <div class="signal-header">
                        <div class="signal-type ${signalClass}">${signal.type}</div>
                        <div class="confidence">${signal.confidence}</div>
                    </div>
                    <div class="signal-details">
                        <div class="detail-item">
                            <div class="detail-label">Entry</div>
                            <div class="detail-value">${signal.entry}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Stop Loss</div>
                            <div class="detail-value">${signal.sl}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Take Profit</div>
                            <div class="detail-value">${signal.tp}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Risk/Reward</div>
                            <div class="detail-value">${calculateRR(signal)}</div>
                        </div>
                    </div>
                    <div class="signal-reason">
                        ${signal.reason}
                    </div>
                </div>
            `;
            
        } catch (error) {
            console.error('Parse error:', error);
            document.getElementById('analysisContent').innerHTML = `
                <div style="color: var(--accent-red); padding: 20px;">
                    Failed to parse AI response
                </div>
            `;
        }
    }
    
    // Calculate Risk/Reward ratio
    function calculateRR(signal) {
        const entry = parseFloat(signal.entry);
        const sl = parseFloat(signal.sl);
        const tp = parseFloat(signal.tp);
        
        const risk = Math.abs(entry - sl);
        const reward = Math.abs(tp - entry);
        
        if (risk > 0) {
            const rr = reward / risk;
            return `1:${rr.toFixed(2)}`;
        }
        return 'N/A';
    }
    
    // Execute trade
    function executeTrade(direction) {
        if (!lastSignal) {
            alert('Please analyze market first');
            return;
        }
        
        if (lastSignal.type !== direction) {
            const confirm = window.confirm(`AI suggests ${lastSignal.type}, but you want to ${direction}. Continue?`);
            if (!confirm) return;
        }
        
        alert(`${direction} order would be placed here.\n\nIn production, this would connect to your broker's API.`);
    }
    
    // Close all positions
    function closeAll() {
        alert('All positions would be closed here.\n\nIn production, this would connect to your broker's API.');
    }
    
    // Auto analysis
    function startAutoAnalysis() {
        const interval = parseInt(document.getElementById('analysisInterval').value) * 60 * 1000;
        
        if (analysisTimer) {
            clearInterval(analysisTimer);
        }
        
        analysisTimer = setInterval(() => {
            analyzeMarket();
        }, interval);
    }
    
    // Initialize on load
    window.onload = function() {
        initTradingView();
        
        // Load saved settings
        const savedApiKey = localStorage.getItem('groqApiKey');
        if (savedApiKey) {
            document.getElementById('apiKey').value = savedApiKey;
        }
        
        // Save API key on change
        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('groqApiKey', e.target.value);
        });
    };
</script>
