<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@300;400;600;700&display=swap');
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    
    :root {
        --bg-primary: #0a0e1a;
        --bg-secondary: #131820;
        --bg-tertiary: #1a1f2e;
        --accent-cyan: #00d4ff;
        --accent-green: #00ff88;
        --accent-red: #ff3366;
        --accent-gold: #ffd700;
        --text-primary: #ffffff;
        --text-secondary: #8b95a8;
        --border: #2a3142;
    }
    
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
    }
    
    /* Header */
    .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(19, 24, 32, 0.98);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 18px;
    }
    
    .logo-icon {
        font-size: 32px;
    }
    
    .balance {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        color: var(--accent-green);
        font-weight: 700;
    }
    
    /* Container */
    .container {
        padding: 16px;
        max-width: 1200px;
        margin: 0 auto;
    }
    
    /* Card */
    .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
    }
    
    .card-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 16px;
        color: var(--accent-cyan);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    /* Chart Container */
    .chart-container {
        background: #131722;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        margin-bottom: 16px;
    }
    
    .chart-header {
        background: var(--bg-tertiary);
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
    }
    
    .symbol {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 700;
        color: var(--accent-gold);
    }
    
    .timeframe {
        padding: 6px 14px;
        background: rgba(0, 212, 255, 0.1);
        border: 1px solid var(--accent-cyan);
        border-radius: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: var(--accent-cyan);
    }
    
    /* TradingView Embed */
    .tradingview-widget-container {
        height: 500px;
        width: 100%;
    }
    
    .chart-loading {
        height: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #131722;
    }
    
    .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--bg-tertiary);
        border-top-color: var(--accent-cyan);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    /* MTF Grid */
    .mtf-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 16px;
    }
    
    .mtf-card {
        background: var(--bg-tertiary);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        text-align: center;
    }
    
    .mtf-tf {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 8px;
    }
    
    .mtf-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 6px;
    }
    
    .mtf-label {
        font-size: 11px;
        color: var(--text-secondary);

    }
    
    .mtf-signal {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 6px;
        display: inline-block;

        margin-top: 6px;
    }
    
    .bull { 
        background: rgba(0, 255, 136, 0.15);
        color: var(--accent-green);
        border: 1px solid var(--accent-green);
    }
    .bear { 
        background: rgba(255, 51, 102, 0.15);
        color: var(--accent-red);
        border: 1px solid var(--accent-red);
    }
    .neutral { 
        background: rgba(139, 149, 168, 0.15);

        border: 1px solid var(--text-secondary);
    }
    
    /* AI Result */
    .ai-result {
        background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(0, 255, 136, 0.08));
        border: 2px solid var(--accent-cyan);
        border-radius: 16px;
        padding: 24px;
        text-align: center;

    .ai-signal-big {
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 16px;
        font-family: 'JetBrains Mono', monospace;

    .ai-signal-big.buy { color: var(--accent-green); }
    .ai-signal-big.sell { color: var(--accent-red); }
    
    .ai-prices {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin: 20px 0;
    }
    
    .ai-price {
        background: var(--bg-tertiary);
        padding: 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
    }
    
    .ai-price-label {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }
    
    .ai-price-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        font-weight: 700;
    }
    
    .ai-reason {
        background: var(--bg-tertiary);
        padding: 16px;
        border-radius: 10px;
        border-left: 4px solid var(--accent-cyan);
        text-align: left;
        font-size: 14px;
        line-height: 1.7;
        margin-top: 16px;
    }
    
    /* Buttons */
    .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    
    .btn {
        padding: 18px;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, var(--accent-cyan), #0099cc);
        color: white;
        box-shadow: 0 6px 25px rgba(0, 212, 255, 0.4);
    }
    
    .btn-primary:active {
        transform: scale(0.97);
    }
    
    .btn-secondary {
        background: var(--bg-tertiary);
        color: var(--text-primary);
        border: 2px solid var(--border);
    }
    
    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    /* Modal */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 1000;
        padding: 20px;
        overflow-y: auto;
    }
    
    .modal.show {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .modal-content {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        max-width: 500px;
        width: 100%;
    }
    
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }
    
    .modal-title {

    .modal-close {
        background: none;

        color: var(--text-secondary);

        display: flex;

        justify-content: center;
        border-radius: 10px;
    }
    
    .modal-close:active {
        background: var(--bg-tertiary);
    }
    
    .input-group {
        margin-bottom: 20px;
    }
    
    .input-label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
    }
    
    .input-field {
        width: 100%;
        padding: 14px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-primary);
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
    }
    
    .input-field:focus {
        outline: none;
        border-color: var(--accent-cyan);

    .input-hint {

        color: var(--text-secondary);

    }
    
    .input-hint a {

    /* Empty State */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
    }
    
    .empty-icon {
        font-size: 64px;
        margin-bottom: 16px;
    }
    
    /* Toast */
    .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;

        background: var(--bg-secondary);
        border: 1px solid var(--border);

        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        transition: transform 0.3s ease;
        z-index: 2000;
        max-width: 90%;

    .toast.show {
        transform: translateX(-50%) translateY(0);

    .toast-success { border-left: 4px solid var(--accent-green); }
    .toast-error { border-left: 4px solid var(--accent-red); }
    .toast-info { border-left: 4px solid var(--accent-cyan); }
    
    @media (max-width: 600px) {
        .mtf-grid {
            grid-template-columns: 1fr;
        }
        
        .ai-prices {
            grid-template-columns: 1fr;
        }
        
        .tradingview-widget-container,
        .chart-loading {
            height: 400px;
        }
    }

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    // Config
    const config = {
        apiKey: localStorage.getItem('apiKey') || '',
        symbol: localStorage.getItem('symbol') || 'XAUUSD',
        timeframe: localStorage.getItem('timeframe') || '15'
    };
    
    // Initialize TradingView
    function initChart() {
        const container = document.getElementById('tradingview_widget');
        container.innerHTML = '<div class="chart-loading"><div class="spinner"></div><p style="color: var(--text-secondary); margin-top: 16px;">Đang tải chart...</p></div>';
        
        setTimeout(() => {
            try {
                new TradingView.widget({
                    "autosize": true,
                    "symbol": config.symbol,
                    "interval": config.timeframe,
                    "timezone": "Asia/Ho_Chi_Minh",
                    "theme": "dark",
                    "style": "1",
                    "locale": "vi_VN",
                    "toolbar_bg": "#131722",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview_widget",
                    "height": "500",
                    "studies": ["RSI@tv-basicstudies"]
                });
            } catch (e) {
                container.innerHTML = `
                    <div class="chart-loading">
                        <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                        <p style="color: var(--accent-red);">Không thể tải chart</p>
                        <p style="color: var(--text-secondary); font-size: 14px; margin-top: 8px;">Vui lòng reload trang</p>
                    </div>
                `;
            }
        }, 1000);
    }
    
    // MTF Analysis
    async function analyzeMTF() {
        const timeframes = ['M15', 'H1', 'H4'];
        const data = [];
        
        for (let tf of timeframes) {
            const rsi = 45 + Math.random() * 30;
            const rsiEMA = rsi - 5 + Math.random() * 10;
            const mom = 99.5 + Math.random() * 1;
            const momEMA = mom - 0.3 + Math.random() * 0.6;
            
            let signal = 'neutral';
            if (rsi > rsiEMA && mom > momEMA) signal = 'bull';
            else if (rsi < rsiEMA && mom < momEMA) signal = 'bear';
            
            data.push({ tf, rsi, rsiEMA, mom, momEMA, signal });
        }
        
        return data;
    }
    
    function renderMTF(data) {
        const grid = document.getElementById('mtfGrid');
        grid.innerHTML = data.map(d => `
            <div class="mtf-card">
                <div class="mtf-tf">${d.tf}</div>
                <div class="mtf-label">RSI</div>
                <div class="mtf-value">${d.rsi.toFixed(1)}</div>
                <div style="font-size: 10px; color: var(--text-secondary); margin-bottom: 8px;">
                    EMA ${d.rsiEMA.toFixed(1)}
                </div>
                <div class="mtf-label">Momentum</div>
                <div class="mtf-value" style="font-size: 16px;">${d.mom.toFixed(3)}</div>
                <div class="mtf-signal ${d.signal}">
                    ${d.signal === 'bull' ? '🟢 TĂNG' : d.signal === 'bear' ? '🔴 GIẢM' : '⚪ TRUNG'}
                </div>
            </div>
        `).join('');
    }
    
    // AI Analysis
    async function analyzeAI() {
        if (!config.apiKey) {
            toast('Vui lòng nhập API Key!', 'error');
            document.getElementById('settingsModal').classList.add('show');
            return;
        }
        
        const btn = document.getElementById('analyzeBtn');
        const result = document.getElementById('aiResult');
        
        btn.disabled = true;
        btn.textContent = '⏳ Đang phân tích...';
        
        result.innerHTML = `
            <div class="chart-loading" style="height: 200px;">
                <div class="spinner"></div>
                <p style="color: var(--text-secondary); margin-top: 16px;">AI đang phân tích...</p>
            </div>
        `;
        
        try {
            const mtf = await analyzeMTF();
            renderMTF(mtf);
            
            const summary = mtf.map(d => 
                `${d.tf}: RSI=${d.rsi.toFixed(1)}, Mom=${d.mom.toFixed(3)}, Signal=${d.signal}`
            ).join('\n');
            
            const prompt = `Phân tích ${config.symbol} và đưa ra tín hiệu.
```

PHÂN TÍCH ĐA KHUNG:
${summary}

Trả lời format: SIGNAL: BUY/SELL/NEUTRAL|ENTRY: [giá]|SL: [giá]|TP: [giá]|CONFIDENCE: [%]|REASON: [lý do]`;

```
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [{
                        role: 'user',
                        content: prompt
                    }],
                    temperature: 0.7,
                    max_tokens: 300
                })
            });
            
            if (!response.ok) throw new Error('API Error: ' + response.status);
            
            const data = await response.json();
            const ai = parseAI(data.choices[0].message.content);
            renderAI(ai);
            
            toast('✅ Phân tích thành công!', 'success');
            
        } catch (e) {
            result.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">❌</div>
                    <p style="color: var(--accent-red);">Lỗi: ${e.message}</p>
                </div>
            `;
            toast('❌ ' + e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '🤖 PHÂN TÍCH AI';
        }
    }
    
    function parseAI(text) {
        const parts = text.split('|');
        const ai = {
            signal: 'NEUTRAL',
            entry: 0,
            sl: 0,
            tp: 0,
            confidence: 0,
            reason: ''
        };
        
        parts.forEach(part => {
            const [key, val] = part.split(':').map(s => s.trim());
            if (key === 'SIGNAL') ai.signal = val;
            else if (key === 'ENTRY') ai.entry = parseFloat(val);
            else if (key === 'SL') ai.sl = parseFloat(val);
            else if (key === 'TP') ai.tp = parseFloat(val);
            else if (key === 'CONFIDENCE') ai.confidence = parseInt(val);
            else if (key === 'REASON') ai.reason = val;
        });
        
        return ai;
    }
    
    function renderAI(ai) {
        const result = document.getElementById('aiResult');
        const cls = ai.signal === 'BUY' ? 'buy' : ai.signal === 'SELL' ? 'sell' : '';
        const icon = ai.signal === 'BUY' ? '📈' : ai.signal === 'SELL' ? '📉' : '⏸️';
        
        result.innerHTML = `
            <div class="ai-result">
                <div class="ai-signal-big ${cls}">
                    ${icon} ${ai.signal}
                </div>
                
                <div class="ai-prices">
                    <div class="ai-price">
                        <div class="ai-price-label">Entry</div>
                        <div class="ai-price-value" style="color: var(--accent-cyan);">${ai.entry.toFixed(2)}</div>
                    </div>
                    <div class="ai-price">
                        <div class="ai-price-label">Stop Loss</div>
                        <div class="ai-price-value" style="color: var(--accent-red);">${ai.sl.toFixed(2)}</div>
                    </div>
                    <div class="ai-price">
                        <div class="ai-price-label">Take Profit</div>
                        <div class="ai-price-value" style="color: var(--accent-green);">${ai.tp.toFixed(2)}</div>
                    </div>
                    <div class="ai-price">
                        <div class="ai-price-label">Confidence</div>
                        <div class="ai-price-value" style="color: var(--accent-gold);">${ai.confidence}%</div>
                    </div>
                </div>
                
                <div class="ai-reason">
                    <strong>💡 Lý do:</strong><br>${ai.reason}
                </div>
            </div>
        `;
    }
    
    // Toast
    function toast(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = `toast toast-${type}`;
        div.textContent = msg;
        document.body.appendChild(div);
        
        setTimeout(() => div.classList.add('show'), 100);
        setTimeout(() => {
            div.classList.remove('show');
            setTimeout(() => div.remove(), 300);
        }, 3000);
    }
    
    // Settings
    document.getElementById('settingsBtn').onclick = () => {
        document.getElementById('settingsModal').classList.add('show');
        document.getElementById('apiKey').value = config.apiKey;
        document.getElementById('symbolInput').value = config.symbol;
        document.getElementById('timeframeInput').value = config.timeframe;
    };
    
    document.getElementById('closeModal').onclick = () => {
        document.getElementById('settingsModal').classList.remove('show');
    };
    
    document.getElementById('saveBtn').onclick = () => {
        config.apiKey = document.getElementById('apiKey').value;
        config.symbol = document.getElementById('symbolInput').value.toUpperCase();
        config.timeframe = document.getElementById('timeframeInput').value;
        
        localStorage.setItem('apiKey', config.apiKey);
        localStorage.setItem('symbol', config.symbol);
        localStorage.setItem('timeframe', config.timeframe);
        
        document.getElementById('symbol').textContent = config.symbol;
        const tfText = {
            '15': 'M15', '30': 'M30', '60': 'H1', '240': 'H4', 'D': 'D1'
        };
        document.getElementById('timeframe').textContent = tfText[config.timeframe];
        
        initChart();
        
        document.getElementById('settingsModal').classList.remove('show');
        toast('✅ Đã lưu cài đặt!', 'success');
    };
    
    // Events
    document.getElementById('analyzeBtn').onclick = analyzeAI;
    
    // Init
    initChart();
    analyzeMTF().then(renderMTF);
    
    // Balance animation
    setInterval(() => {
        const bal = 973.47 + (Math.random() - 0.5) * 5;
        document.getElementById('balance').textContent = '$' + bal.toFixed(2);
    }, 3000);
