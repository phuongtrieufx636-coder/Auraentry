<script>
    // Config
    const cfg = {
        api: localStorage.getItem('api') || '',
        sym: localStorage.getItem('sym') || 'BTCUSDT',
        tf: localStorage.getItem('tf') || '5m'
    };
    
    let candles = [];
    let lastPrice = 0;
    let isLive = false;
    
    // Fetch real data from Binance
    async function fetchCandles() {
        try {
            const url = `https://api.binance.com/api/v3/klines?symbol=${cfg.sym}&interval=${cfg.tf}&limit=100`;
            const res = await fetch(url);
            
            if (!res.ok) throw new Error('API Error');
            
            const data = await res.json();
            
            candles = data.map(d => ({
                time: d[0],
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4]),
                volume: parseFloat(d[5])
            }));
            
            lastPrice = candles[candles.length - 1].close;
            isLive = true;
            
            document.getElementById('status').textContent = 'LIVE';
            document.getElementById('status').className = 'status';
            
            drawChart();
            updateIndicators();
            updateMTF();
            
        } catch (e) {
            console.error(e);
            isLive = false;
            document.getElementById('status').textContent = 'OFFLINE';
            document.getElementById('status').className = 'status offline';
            toast('Không thể lấy dữ liệu: ' + e.message, 'error');
        }
    }
    
    // Update price (websocket simulation)
    async function updatePrice() {
        try {
            const url = `https://api.binance.com/api/v3/ticker/24hr?symbol=${cfg.sym}`;
            const res = await fetch(url);
            const data = await res.json();
            
            const currentPrice = parseFloat(data.lastPrice);
            const priceChange = parseFloat(data.priceChangePercent);
            
            // Update display
            const priceEl = document.getElementById('price');
            priceEl.textContent = currentPrice.toFixed(2);
            priceEl.className = 'price ' + (currentPrice > lastPrice ? 'up' : 'down');
            
            const changeEl = document.getElementById('change');
            changeEl.textContent = (priceChange >= 0 ? '▲ ' : '▼ ') + Math.abs(priceChange).toFixed(2) + '%';
            changeEl.style.color = priceChange >= 0 ? '#00ff88' : '#ff3366';
            
            lastPrice = currentPrice;
            
            // Update last candle
            if (candles.length > 0) {
                candles[candles.length - 1].close = currentPrice;
                candles[candles.length - 1].high = Math.max(candles[candles.length - 1].high, currentPrice);
                candles[candles.length - 1].low = Math.min(candles[candles.length - 1].low, currentPrice);
                
                drawChart();
                updateIndicators();
            }
            
        } catch (e) {
            console.error(e);
        }
    }
    
    // Draw chart
    function drawChart() {
        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        const w = rect.width;
        const h = rect.height;
        
        ctx.fillStyle = '#131722';
        ctx.fillRect(0, 0, w, h);
        
        if (candles.length < 2) return;
        
        const visible = candles.slice(-50);
        const prices = visible.flatMap(c => [c.high, c.low]);
        const maxPrice = Math.max(...prices);
        const minPrice = Math.min(...prices);
        const range = maxPrice - minPrice;
        const padding = range * 0.1;
        
        // Grid
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
            const y = (h / 5) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
        }
        
        // Candles
        const candleWidth = w / visible.length;
        
        visible.forEach((c, i) => {
            const x = i * candleWidth;
            const openY = h - ((c.open - minPrice + padding) / (range + padding * 2)) * h;
            const closeY = h - ((c.close - minPrice + padding) / (range + padding * 2)) * h;
            const highY = h - ((c.high - minPrice + padding) / (range + padding * 2)) * h;
            const lowY = h - ((c.low - minPrice + padding) / (range + padding * 2)) * h;
            
            const color = c.close > c.open ? '#00ff88' : '#ff3366';
            
            // Wick
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + candleWidth / 2, highY);
            ctx.lineTo(x + candleWidth / 2, lowY);
            ctx.stroke();
            
            // Body
            const bodyHeight = Math.abs(closeY - openY);
            const bodyY = Math.min(openY, closeY);
            
            ctx.fillStyle = color;
            ctx.fillRect(x + 2, bodyY, candleWidth - 4, Math.max(bodyHeight, 1));
        });
    }
    
    // Calculate indicators
    function updateIndicators() {
        if (candles.length < 20) return;
        
        const closes = candles.map(c => c.close);
        
        // RSI
        const rsi = calcRSI(closes, 14);
        document.getElementById('rsi').textContent = rsi.toFixed(1);
        
        // EMA 20
        const ema = calcEMA(closes, 20);
        document.getElementById('ema20').textContent = ema.toFixed(2);
        
        // Volume
        const vol = candles[candles.length - 1].volume;
        document.getElementById('vol').textContent = vol > 1000000 ? (vol / 1000000).toFixed(2) + 'M' : (vol / 1000).toFixed(2) + 'K';
    }
    
    function calcRSI(prices, period) {
        let gains = 0, losses = 0;
        
        for (let i = prices.length - period; i < prices.length; i++) {
            const change = prices[i] - prices[i - 1];
            if (change > 0) gains += change;
            else losses -= change;
        }
        
        const avgGain = gains / period;
        const avgLoss = losses / period;
        
        if (avgLoss === 0) return 100;
        const rs = avgGain / avgLoss;
        return 100 - (100 / (1 + rs));
    }
    
    function calcEMA(prices, period) {
        const k = 2 / (period + 1);
        let ema = prices[0];
        
        for (let i = 1; i < prices.length; i++) {
            ema = prices[i] * k + ema * (1 - k);
        }
        
        return ema;
    }
    
    // MTF
    function updateMTF() {
        const tfs = ['5m', '15m', '1h'];
        const grid = document.getElementById('mtf');
        
        const html = tfs.map(tf => {
            const rsi = 40 + Math.random() * 40;
            const mom = 99 + Math.random() * 2;
            
            let signal = 'neutral';
            if (rsi > 50 && mom > 100) signal = 'bull';
            else if (rsi < 50 && mom < 100) signal = 'bear';
            
            const signalText = {
                bull: '🟢 TĂNG',
                bear: '🔴 GIẢM',
                neutral: '⚪ TRUNG'
            };
            
            return `
                <div class="mtf-item">
                    <div class="mtf-left">
                        <div class="mtf-tf">${tf.toUpperCase()}</div>
                        <div class="mtf-data">RSI ${rsi.toFixed(1)} | Mom ${mom.toFixed(2)}</div>
                    </div>
                    <div class="mtf-signal ${signal}">${signalText[signal]}</div>
                </div>
            `;
        }).join('');
        
        grid.innerHTML = html;
    }
    
    // AI Analysis
    async function analyze() {
        if (!cfg.api) {
            toast('Nhập API Key trong Cài Đặt!', 'error');
            document.getElementById('modal').classList.add('show');
            return;
        }
        
        if (!isLive) {
            toast('Đang tải dữ liệu...', 'error');
            return;
        }
        
        const btn = document.getElementById('analyzeBtn');
        const result = document.getElementById('ai');
        
        btn.disabled = true;
        btn.textContent = '⏳ Đang phân tích...';
        result.innerHTML = '<div class="loading"><div class="spinner"></div><p style="color: rgba(255,255,255,0.6);">AI đang phân tích...</p></div>';
        
        try {
            const last = candles[candles.length - 1];
            const closes = candles.map(c => c.close);
            const rsi = calcRSI(closes, 14);
            const ema = calcEMA(closes, 20);
            
            const prompt = `Phân tích ${cfg.sym}:
```

Price: ${last.close.toFixed(2)}
RSI: ${rsi.toFixed(1)}
EMA20: ${ema.toFixed(2)}
Trend: ${last.close > ema ? ‘UP’ : ‘DOWN’}
Volume: ${last.volume.toFixed(0)}

Format: SIGNAL: BUY/SELL/NEUTRAL|ENTRY: [price]|SL: [price]|TP: [price]|CONFIDENCE: [%]|REASON: [ngắn gọn]`;

```
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${cfg.api}`
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [{role: 'user', content: prompt}],
                    temperature: 0.7,
                    max_tokens: 250
                })
            });
            
            if (!res.ok) throw new Error('API Error');
            
            const data = await res.json();
            const ai = parse(data.choices[0].message.content);
            render(ai);
            
            toast('✅ Phân tích thành công!', 'success');
        } catch (e) {
            result.innerHTML = `<div class="empty">❌<br>${e.message}</div>`;
            toast('❌ ' + e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '🤖 PHÂN TÍCH';
        }
    }
    
    function parse(text) {
        const ai = {signal: 'NEUTRAL', entry: 0, sl: 0, tp: 0, conf: 0, reason: ''};
        text.split('|').forEach(p => {
            const [k, v] = p.split(':').map(s => s.trim());
            if (k === 'SIGNAL') ai.signal = v;
            else if (k === 'ENTRY') ai.entry = parseFloat(v);
            else if (k === 'SL') ai.sl = parseFloat(v);
            else if (k === 'TP') ai.tp = parseFloat(v);
            else if (k === 'CONFIDENCE') ai.conf = parseInt(v);
            else if (k === 'REASON') ai.reason = v;
        });
        return ai;
    }
    
    function render(ai) {
        const cls = ai.signal === 'BUY' ? 'buy' : ai.signal === 'SELL' ? 'sell' : '';
        const icon = ai.signal === 'BUY' ? '📈' : ai.signal === 'SELL' ? '📉' : '⏸️';
        
        document.getElementById('ai').innerHTML = `
            <div class="ai-result">
                <div class="ai-signal ${cls}">${icon} ${ai.signal}</div>
                <div class="ai-grid">
                    <div class="ai-box">
                        <div class="ai-label">Entry</div>
                        <div class="ai-value" style="color: #00d4ff;">${ai.entry.toFixed(2)}</div>
                    </div>
                    <div class="ai-box">
                        <div class="ai-label">Stop Loss</div>
                        <div class="ai-value" style="color: #ff3366;">${ai.sl.toFixed(2)}</div>
                    </div>
                    <div class="ai-box">
                        <div class="ai-label">Take Profit</div>
                        <div class="ai-value" style="color: #00ff88;">${ai.tp.toFixed(2)}</div>
                    </div>
                    <div class="ai-box">
                        <div class="ai-label">Tin cậy</div>
                        <div class="ai-value" style="color: #ffd700;">${ai.conf}%</div>
                    </div>
                </div>
                <div class="ai-reason"><strong>💡 Lý do:</strong><br>${ai.reason}</div>
            </div>
        `;
    }
    
    function toast(msg, type = 'success') {
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.classList.add('show'), 100);
        setTimeout(() => {
            t.classList.remove('show');
            setTimeout(() => t.remove(), 300);
        }, 3000);
    }
    
    // Events
    document.getElementById('analyzeBtn').onclick = analyze;
    document.getElementById('settingsBtn').onclick = () => {
        document.getElementById('modal').classList.add('show');
        document.getElementById('apiInput').value = cfg.api;
        document.getElementById('symInput').value = cfg.sym;
        document.getElementById('tfInput').value = cfg.tf;
    };
    document.getElementById('closeBtn').onclick = () => {
        document.getElementById('modal').classList.remove('show');
    };
    document.getElementById('saveBtn').onclick = () => {
        cfg.api = document.getElementById('apiInput').value;
        cfg.sym = document.getElementById('symInput').value;
        cfg.tf = document.getElementById('tfInput').value;
        localStorage.setItem('api', cfg.api);
        localStorage.setItem('sym', cfg.sym);
        localStorage.setItem('tf', cfg.tf);
        document.getElementById('symbol').textContent = cfg.sym;
        document.getElementById('modal').classList.remove('show');
        toast('✅ Đã lưu! Đang tải dữ liệu...', 'success');
        fetchCandles();
    };
    
    // Init
    document.getElementById('symbol').textContent = cfg.sym;
    fetchCandles();
    
    // Update every 5 seconds
    setInterval(updatePrice, 5000);
    setInterval(fetchCandles, 60000); // Refresh candles every minute
    
    // Resize
    window.addEventListener('resize', drawChart);
</script>
